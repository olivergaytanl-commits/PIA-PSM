<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strike Zone - Filtros</title>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #b5d5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    button {
      cursor: pointer;
    }

    .mobile-container {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 16px 24px;
    }

    .header-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
      width: 100%;
    }

    .header-title h1 {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #000;
    }

    .ball-icon {
      font-size: 24px;
    }

    .filters-main-card {
      width: 100%;
      flex: 1;
      background: linear-gradient(180deg, #d880bc 0%, #9e5ba8 100%);
      border-radius: 28px;
      padding: 16px 14px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0,0,0,.15);
      position: relative;
    }

    .filters-banner {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px 10px;
    }

    .filters-banner h2 {
      font-family: Georgia, serif;
      font-size: 22px;
      font-weight: bold;
      color: #000;
      text-transform: uppercase;
    }

    .filters-banner img {
      width: 58px;
      height: 58px;
      object-fit: contain;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,.2));
    }

    /* VISOR DEL GIF */

    .video-viewport {
      width: 100%;
      height: 380px;
      background: #111;
      border-radius: 22px;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0 10px rgba(0,0,0,.4);
    }

    #targetGif {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: filter .3s ease;
      display: none;
    }

    .gif-placeholder {
      color: white;
      text-align: center;
      padding: 20px;
      line-height: 1.6;
    }

    .filters-palette {
      position: absolute;
      bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
      background: rgba(0,0,0,.55);
      padding: 8px 10px;
      border-radius: 14px;
      z-index: 5;
    }

    .filter-swatch {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      cursor: pointer;
      border: 2.5px solid rgba(255,255,255,.8);
      box-shadow: 0 2px 6px rgba(0,0,0,.3);
      transition: transform .15s ease;
    }

    .filter-swatch.active {
      transform: scale(1.15);
      border-color: white;
      box-shadow: 0 0 10px white;
    }

    .swatch-none {
      background: linear-gradient(135deg, #fff, #999);
    }

    .swatch-warm {
      background: linear-gradient(135deg, #ff7e5f, #feb47b);
    }

    .swatch-cool {
      background: linear-gradient(135deg, #1fa2ff, #12d8fa);
    }

    .swatch-vintage {
      background: linear-gradient(135deg, #e0eafc, #cfdef3);
    }

    .swatch-field {
      background: linear-gradient(135deg, #56ab2f, #a8e063);
    }

    .swatch-sunset {
      background: linear-gradient(135deg, #f7ce55, #4ca1af);
    }

    /* FILTROS */

    .filter-none { filter: none; }
    .filter-warm { filter: sepia(.35) saturate(1.8) contrast(1.1); }
    .filter-cool { filter: hue-rotate(180deg) saturate(1.2) brightness(1.05); }
    .filter-vintage { filter: grayscale(.5) contrast(1.2) brightness(1.15); }
    .filter-field { filter: hue-rotate(65deg) saturate(2) brightness(.95); }
    .filter-sunset { filter: contrast(1.3) brightness(1.1) saturate(1.7) sepia(.2); }

    /* SELECTOR DE EQUIPOS */

    .team-strip-wrapper {
      width: 100%;
      margin-top: 18px;
    }

    .team-strip-label {
      color: white;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 10px;
      text-align: center;
    }

    .team-carousel {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: 100%;
    }

    .team-arrow {
      flex: 0 0 34px;
      width: 34px;
      height: 44px;
      border: none;
      border-radius: 10px;
      background: rgba(255,255,255,.85);
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,.15);
    }

    .team-arrow:disabled {
      opacity: .35;
      cursor: default;
    }

    .team-strip {
      display: flex;
      justify-content: center;
      gap: 7px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }

    .team-chip {
      flex: 1;
      min-width: 0;
      max-width: 78px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      background: none;
      border: none;
      padding: 3px 0;
    }

    .team-chip-logo {
      width: 52px;
      height: 52px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 7px;
      box-shadow: 0 2px 6px rgba(0,0,0,.2);
      border: 3px solid transparent;
      transition: .15s ease;
    }

    .team-chip-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .team-chip.selected .team-chip-logo {
      border-color: white;
      transform: scale(1.08);
      box-shadow: 0 0 10px rgba(255,255,255,.75);
    }

    .team-chip-name {
      font-size: 9px;
      font-weight: 800;
      color: white;
      text-align: center;
      text-transform: uppercase;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .team-counter {
      text-align: center;
      font-size: 11px;
      color: white;
      margin-top: 5px;
      font-weight: bold;
    }

    /* BOTONES */

    .actions-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      padding: 0 14px;
    }

    .action-square-btn {
      width: 58px;
      height: 58px;
      background: white;
      border: 3px solid #111;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,.18);
      color: #111;
    }

    .action-square-btn:active {
      transform: scale(.92);
    }

    /* MODAL DE GIF */

    .video-picker-modal {
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      min-height: 100%;
      background: rgba(0,0,0,.7);
      border-radius: 28px;
      z-index: 10;
      padding: 20px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(4px);
    }

    .picker-card {
      background: white;
      width: 100%;
      border-radius: 20px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .picker-card h3 {
      font-size: 16px;
      text-align: center;
      color: #111;
      font-weight: 800;
    }

    .video-options-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
      max-height: 360px;
      overflow-y: auto;
    }

    .video-option-btn {
      background: #f0f2f5;
      border: 2px solid transparent;
      padding: 7px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 700;
      width: 100%;
      color: #222;
    }

    .video-option-btn img {
      width: 100%;
      height: 85px;
      object-fit: cover;
      border-radius: 7px;
      background: #222;
    }

    .video-option-btn.active {
      border-color: #9e5ba8;
      background: #f7e4f3;
    }

    .close-modal-btn {
      background: #e85375;
      color: white;
      border: none;
      padding: 9px 16px;
      border-radius: 12px;
      font-weight: bold;
      align-self: center;
    }

    .home-container {
      margin-top: 16px;
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .home-btn {
      width: 54px;
      height: 54px;
      background: #3c65c4;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0,0,0,.25);
    }

    @media (max-width: 360px) {
      .video-viewport {
        height: 320px;
      }

      .team-chip-logo {
        width: 44px;
        height: 44px;
      }

      .team-arrow {
        flex-basis: 29px;
        width: 29px;
      }
    }
  </style>
</head>

<body>
<main class="mobile-container">

  <header class="header-title">
    <h1>Strike Zone</h1>
    <span class="ball-icon">⚾</span>
    <i data-lucide="heart" style="width:22px;height:22px;fill:#ff4757;color:#ff4757;"></i>
  </header>

  <div class="filters-main-card">

    <div class="filters-banner">
      <h2>Filtros</h2>
      <img src="https://cdn-icons-png.flaticon.com/512/4406/4406319.png" alt="Cámara">
    </div>

    <!-- VISOR DEL GIF -->
    <div class="video-viewport">

      <div class="gif-placeholder" id="gifPlaceholder">
        <i data-lucide="image" style="width:45px;height:45px;"></i>
        <p>Selecciona un equipo y después elige uno de sus GIF.</p>
      </div>

      <img id="targetGif" alt="GIF seleccionado">

      <!-- FILTROS -->
      <div class="filters-palette">

        <button class="filter-swatch swatch-none"
          data-filter="filter-none" title="Sin filtro" aria-label="Sin filtro"></button>

        <button class="filter-swatch swatch-warm"
          data-filter="filter-warm" title="Cálido" aria-label="Cálido"></button>

        <button class="filter-swatch swatch-cool"
          data-filter="filter-cool" title="Frío" aria-label="Frío"></button>

        <button class="filter-swatch swatch-vintage"
          data-filter="filter-vintage" title="Vintage" aria-label="Vintage"></button>

        <button class="filter-swatch swatch-field"
          data-filter="filter-field" title="Campo verde" aria-label="Campo verde"></button>

        <button class="filter-swatch swatch-sunset"
          data-filter="filter-sunset" title="Atardecer" aria-label="Atardecer"></button>

      </div>
    </div>

    <!-- SELECTOR DE EQUIPOS -->
    <div class="team-strip-wrapper">

      <div class="team-strip-label">
        Elige un equipo
      </div>

      <div class="team-carousel">

        <button class="team-arrow" id="prevTeam" aria-label="Equipos anteriores">
          <i data-lucide="chevron-left"></i>
        </button>

        <div class="team-strip" id="teamStrip"></div>

        <button class="team-arrow" id="nextTeam" aria-label="Equipos siguientes">
          <i data-lucide="chevron-right"></i>
        </button>

      </div>

      <div class="team-counter" id="teamCounter">1 - 3 de 15</div>
    </div>

    <!-- ACCIONES -->
    <div class="actions-bar">

      <button class="action-square-btn" id="openPickerBtn"
        aria-label="Ver GIF del equipo">
        <i data-lucide="image" style="width:32px;height:32px;"></i>
      </button>

      <button class="action-square-btn" id="saveGifBtn"
        aria-label="Guardar GIF">
        <i data-lucide="bookmark" style="width:32px;height:32px;"></i>
      </button>

    </div>

    <!-- MODAL -->
    <div class="video-picker-modal" id="gifModal">

      <div class="picker-card">

        <h3 id="pickerTitle">GIF del equipo</h3>

        <div class="video-options-list" id="gifOptionsList"></div>

        <button class="close-modal-btn" id="closeModalBtn">
          Cerrar
        </button>

      </div>
    </div>

  </div>

  <div class="home-container">
    <a href="index.html" class="home-btn" aria-label="Ir al Inicio">
      <i data-lucide="home" style="width:28px;height:28px;"></i>
    </a>
  </div>

</main>

<script>
  lucide.createIcons();

  // EQUIPOS
  const teamsCatalog = [
    { id: "yankees", name: "Yankees", logo: "147" },
    { id: "athletics", name: "Athletics", logo: "133" },
    { id: "mariners", name: "Mariners", logo: "136" },
    { id: "redsox", name: "Red Sox", logo: "111" },
    { id: "astros", name: "Astros", logo: "117" },
    { id: "rangers", name: "Rangers", logo: "140" },
    { id: "angels", name: "Angels", logo: "108" },
    { id: "orioles", name: "Orioles", logo: "110" },
    { id: "bluejays", name: "Blue Jays", logo: "141" },
    { id: "guardians", name: "Guardians", logo: "114" },
    { id: "cubs", name: "Cubs", logo: "112" },
    { id: "cardinals", name: "Cardinals", logo: "138" },
    { id: "giants", name: "Giants", logo: "137" },
    { id: "padres", name: "Padres", logo: "135" },
    { id: "braves", name: "Braves", logo: "144" }
  ];

  // NOMBRES DE LOS FILTROS
  const filterNames = {
    "filter-none": "Sin filtro",
    "filter-warm": "Cálido",
    "filter-cool": "Frío",
    "filter-vintage": "Vintage",
    "filter-field": "Campo verde",
    "filter-sunset": "Atardecer"
  };

  // ELEMENTOS
  const targetGif = document.getElementById("targetGif");
  const gifPlaceholder = document.getElementById("gifPlaceholder");
  const teamStrip = document.getElementById("teamStrip");
  const teamCounter = document.getElementById("teamCounter");
  const prevTeam = document.getElementById("prevTeam");
  const nextTeam = document.getElementById("nextTeam");
  const gifModal = document.getElementById("gifModal");
  const gifOptionsList = document.getElementById("gifOptionsList");
  const pickerTitle = document.getElementById("pickerTitle");
  const swatches = document.querySelectorAll(".filter-swatch");

  // ESTADO
  let teamStartIndex = 0;
  let selectedTeamId = null;
  let selectedGifUrl = null;
  let selectedGifName = null;
  let currentFilterClass = "filter-none";

  // RUTA DE LOS GIF:
  // assets/gifs/id-del-equipo/gif1.gif ... gif8.gif

  function getGifsForTeam(teamId) {
    return Array.from({ length: 8 }, (_, index) => {
      const number = index + 1;

      return {
        title: `GIF ${number}`,
        src: `assets/gifs/${teamId}/gif${number}.gif`
      };
    });
  }

  // SELECTOR DE EQUIPOS: MUESTRA TRES A LA VEZ
  function renderTeams() {
    const visibleTeams = teamsCatalog.slice(
      teamStartIndex,
      teamStartIndex + 3
    );

    teamStrip.innerHTML = visibleTeams.map(team => `
      <button type="button"
        class="team-chip ${selectedTeamId === team.id ? "selected" : ""}"
        data-team="${team.id}">

        <span class="team-chip-logo">
          <img
            src="https://www.mlbstatic.com/team-logos/${team.logo}.svg"
            alt="${team.name}"
          >
        </span>

        <span class="team-chip-name">${team.name}</span>
      </button>
    `).join("");

    teamCounter.textContent =
      `${teamStartIndex + 1} - ${teamStartIndex + visibleTeams.length} de ${teamsCatalog.length}`;

    prevTeam.disabled = teamStartIndex === 0;
    nextTeam.disabled = teamStartIndex >= teamsCatalog.length - 3;

    lucide.createIcons();
  }

  prevTeam.addEventListener("click", () => {
    if (teamStartIndex > 0) {
      teamStartIndex--;
      renderTeams();
    }
  });

  nextTeam.addEventListener("click", () => {
    if (teamStartIndex < teamsCatalog.length - 3) {
      teamStartIndex++;
      renderTeams();
    }
  });

  // ABRIR SELECTOR DE GIF DE UN EQUIPO
  function openGifPicker(teamId) {
    const team = teamsCatalog.find(t => t.id === teamId);
    if (!team) return;

    selectedTeamId = teamId;
    renderTeams();

    pickerTitle.textContent = `GIF de ${team.name}`;

    const gifs = getGifsForTeam(teamId);

    gifOptionsList.innerHTML = gifs.map(gif => `
      <button type="button"
        class="video-option-btn ${selectedGifUrl === gif.src ? "active" : ""}"
        data-src="${gif.src}"
        data-name="${gif.title}">

        <img src="${gif.src}" alt="${gif.title}"
          onerror="this.style.display='none'; this.parentElement.insertAdjacentText('afterbegin','No se encontró el GIF');">

        <span>${gif.title}</span>
      </button>
    `).join("");

    gifModal.style.display = "flex";
  }

  // CLICK EN UNO DE LOS TRES EQUIPOS
  teamStrip.addEventListener("click", event => {
    const chip = event.target.closest(".team-chip");
    if (!chip) return;

    openGifPicker(chip.dataset.team);
  });

  // BOTÓN PARA VOLVER A ABRIR LOS GIF DEL EQUIPO
  document.getElementById("openPickerBtn").addEventListener("click", () => {
    if (!selectedTeamId) {
      alert("Primero selecciona un equipo.");
      return;
    }

    openGifPicker(selectedTeamId);
  });

  // SELECCIONAR GIF
  gifOptionsList.addEventListener("click", event => {
    const button = event.target.closest(".video-option-btn");
    if (!button) return;

    selectedGifUrl = button.dataset.src;
    selectedGifName = button.dataset.name;

    targetGif.src = selectedGifUrl;
    targetGif.style.display = "block";
    gifPlaceholder.style.display = "none";

    targetGif.className = currentFilterClass;

    gifOptionsList.querySelectorAll(".video-option-btn")
      .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    gifModal.style.display = "none";
  });

  // CERRAR MODAL
  document.getElementById("closeModalBtn").addEventListener("click", () => {
    gifModal.style.display = "none";
  });

  // CAMBIAR FILTRO
  swatches.forEach(swatch => {
    swatch.addEventListener("click", () => {
      swatches.forEach(item => item.classList.remove("active"));
      swatch.classList.add("active");

      currentFilterClass = swatch.dataset.filter;
      targetGif.className = currentFilterClass;
    });
  });

  // GUARDAR EN GALERÍA
  document.getElementById("saveGifBtn").addEventListener("click", () => {
    if (!selectedGifUrl || !selectedTeamId) {
      alert("Primero selecciona un equipo y uno de sus GIF.");
      return;
    }

    const team = teamsCatalog.find(t => t.id === selectedTeamId);

    const savedItem = {
      id: Date.now(),
      type: "gif",
      gifUrl: selectedGifUrl,
      teamId: selectedTeamId,
      teamName: team.name,
      mediaName: selectedGifName,
      appliedFilter: currentFilterClass,
      filterName: filterNames[currentFilterClass],
      date: new Date().toLocaleDateString()
    };

    const existing = JSON.parse(
      localStorage.getItem("strike_gallery") || "[]"
    );

    existing.push(savedItem);

    localStorage.setItem(
      "strike_gallery",
      JSON.stringify(existing)
    );

    if (typeof confetti === "function") {
      confetti({
        particleCount: 70,
        spread: 60,
        origin: { y: 0.6 }
      });
    }

    alert("¡GIF guardado exitosamente en tu Galería!");
  });

  // INICIAR
  renderTeams();

  // Seleccionar el primer equipo por defecto
  selectedTeamId = teamsCatalog[0].id;
  renderTeams();
</script>

</body>
</html>
