
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strike Zone - Galería</title>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #b5d5f5;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    .mobile-container {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 16px 95px;
      position: relative;
    }

    /* Encabezado */
    .header-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
      width: 100%;
    }

    .header-title h1 {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #000;
    }

    .ball-icon {
      font-size: 26px;
      line-height: 1;
    }

    /* Tarjeta principal */
    .gallery-main-card {
      width: 100%;
      background: linear-gradient(180deg, #f7d455 0%, #ed8426 100%);
      border-radius: 28px;
      padding: 16px 14px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      position: relative;
    }

    /* Banner */
    .gallery-banner {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px 4px;
    }

    .gallery-banner h2 {
      font-family: Georgia, serif;
      font-size: 24px;
      font-weight: bold;
      color: #000;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .gallery-banner img {
      width: 58px;
      height: 58px;
      object-fit: contain;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
    }

    /* Grilla */
    .gallery-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .wide-card {
      width: 100%;
      height: 140px;
      background: #73b9e5;
      border-radius: 22px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
      transition: transform 0.15s ease;
    }

    .wide-card:active,
    .tall-card:active,
    .square-card:active,
    .saved-gif-card:active {
      transform: scale(0.97);
    }

    .row-three {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
    }

    .tall-card {
      height: 130px;
      background: #73b9e5;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.12);
      transition: transform 0.15s ease;
    }

    .row-two {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
    }

    .square-card {
      height: 125px;
      background: #73b9e5;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.12);
      transition: transform 0.15s ease;
    }

    .media-item {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.2s ease;
    }

    .card-label {
      position: absolute;
      bottom: 6px;
      left: 8px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 8px;
      backdrop-filter: blur(2px);
    }

    .play-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      backdrop-filter: blur(2px);
    }

    /* Filtros */
    .filter-warm {
      filter: sepia(0.35) saturate(1.8) contrast(1.1);
    }

    .filter-cool {
      filter: hue-rotate(180deg) saturate(1.2) brightness(1.05);
    }

    .filter-vintage {
      filter: grayscale(0.5) contrast(1.2) brightness(1.15);
    }

    .filter-field {
      filter: hue-rotate(65deg) saturate(2) brightness(0.95);
    }

    .filter-sunset {
      filter: contrast(1.3) brightness(1.1) saturate(1.7) sepia(0.2);
    }

    /* Secciones de contenido guardado */
    .saved-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .saved-section-title {
      font-weight: 900;
      font-size: 15px;
      text-transform: uppercase;
      color: #111;
      border-bottom: 2px solid rgba(0, 0, 0, 0.25);
      padding-bottom: 7px;
    }

    .saved-section-description {
      font-size: 11px;
      color: #333;
      margin-top: -5px;
    }

    /* Separación por equipo */
    .team-gallery-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-top: 8px;
    }

    .team-gallery-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 900;
      color: #111;
      text-transform: uppercase;
      padding: 7px 9px;
      background: rgba(255, 255, 255, 0.35);
      border-radius: 10px;
    }

    .team-gallery-title img {
      width: 27px;
      height: 27px;
      object-fit: contain;
    }

    .saved-gif-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
      width: 100%;
    }

    .saved-gif-card {
      height: 125px;
      background: #73b9e5;
      border-radius: 15px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.12);
      transition: transform 0.15s ease;
    }

    .saved-empty {
      text-align: center;
      padding: 15px 8px;
      font-size: 12px;
      color: #333;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 12px;
    }

    /* Visor modal */
    .viewer-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
      flex-direction: column;
      gap: 16px;
    }

    .viewer-content-box {
      width: 100%;
      max-width: 390px;
      max-height: 75vh;
      border-radius: 20px;
      overflow: hidden;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .viewer-content-box video,
    .viewer-content-box img {
      width: 100%;
      height: 100%;
      max-height: 75vh;
      object-fit: contain;
    }

    .close-viewer-btn {
      background: #ffffff;
      color: #111;
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Botón inicio */
    .home-container {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .home-btn {
      width: 56px;
      height: 56px;
      background: #3c65c4;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-decoration: none;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      border: 3px solid #ffffff;
      pointer-events: auto;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .home-btn:active {
      transform: scale(0.9);
      background-color: #2b4b9b;
    }
  </style>
</head>

<body>

  <main class="mobile-container">

    <header class="header-title">
      <h1>Strike Zone</h1>
      <span class="ball-icon">⚾</span>
    </header>

    <div class="gallery-main-card">

      <div class="gallery-banner">
        <h2>Galería</h2>
        <img
          src="https://cdn-icons-png.flaticon.com/512/1375/1375106.png"
          alt="Fotos Galería">
      </div>

      <section class="gallery-grid" id="galleryGrid">

        <!-- Aquí se cargarán las fotos de RA y los GIF guardados -->
        <div id="savedVideosContainer"></div>

      </section>
    </div>

    <!-- Botón Inicio -->
    <div class="home-container">
      <a href="index.html" class="home-btn" aria-label="Ir al Inicio">
        <i data-lucide="home" style="width: 26px; height: 26px;"></i>
      </a>
    </div>

    <!-- Visor -->
    <div class="viewer-modal" id="viewerModal">
      <div class="viewer-content-box" id="viewerBox"></div>

      <button class="close-viewer-btn" id="closeViewerBtn"
        aria-label="Cerrar visor">
        <i data-lucide="x" style="width: 26px; height: 26px;"></i>
      </button>
    </div>

  </main>

  <script>
    lucide.createIcons();

    const viewerModal = document.getElementById("viewerModal");
    const viewerBox = document.getElementById("viewerBox");
    const closeViewerBtn = document.getElementById("closeViewerBtn");
    const savedVideosContainer = document.getElementById("savedVideosContainer");

    // Abrir imagen o GIF
    function openPhotoViewer(url, title) {
      viewerBox.innerHTML = "";

      const img = document.createElement("img");
      img.src = url;
      img.alt = title || "Imagen guardada";

      viewerBox.appendChild(img);
      viewerModal.style.display = "flex";
    }

    // Abrir GIF guardado
    function openGifViewer(gifUrl, filterClass) {
      viewerBox.innerHTML = "";

      const img = document.createElement("img");
      img.src = gifUrl;
      img.alt = "GIF guardado";
      img.className = filterClass || "";

      viewerBox.appendChild(img);
      viewerModal.style.display = "flex";
    }

    // Abrir video antiguo
    function openVideoViewer(videoUrl, filterClass) {
      viewerBox.innerHTML = "";

      const video = document.createElement("video");
      video.className = filterClass || "";
      video.controls = true;
      video.autoplay = true;
      video.loop = true;
      video.playsInline = true;
      video.style.width = "100%";
      video.style.height = "100%";

      const source = document.createElement("source");
      source.src = videoUrl;
      source.type = "video/mp4";

      video.appendChild(source);
      viewerBox.appendChild(video);

      viewerModal.style.display = "flex";
    }

    // Cerrar visor
    closeViewerBtn.addEventListener("click", () => {
      viewerBox.innerHTML = "";
      viewerModal.style.display = "none";
    });

    // También cerrar al tocar el fondo
    viewerModal.addEventListener("click", (event) => {
      if (event.target === viewerModal) {
        viewerBox.innerHTML = "";
        viewerModal.style.display = "none";
      }
    });

    // Leer contenido guardado
    let savedGallery = [];

    try {
      savedGallery = JSON.parse(
        localStorage.getItem("strike_gallery") || "[]"
      );

      if (!Array.isArray(savedGallery)) {
        savedGallery = [];
      }
    } catch (error) {
      console.error("Error al leer la galería:", error);
      savedGallery = [];
    }

    // Crear encabezado de sección
    function createSectionTitle(title, description) {
      const section = document.createElement("div");
      section.className = "saved-section";

      const heading = document.createElement("h3");
      heading.className = "saved-section-title";
      heading.textContent = title;

      section.appendChild(heading);

      if (description) {
        const desc = document.createElement("p");
        desc.className = "saved-section-description";
        desc.textContent = description;
        section.appendChild(desc);
      }

      return section;
    }

    // Crear tarjeta para foto de RA
    function createPhotoCard(item, index) {
      const card = document.createElement("div");
      card.className = "wide-card";
      card.style.marginTop = "8px";

      const img = document.createElement("img");
      img.className = "media-item";
      img.src = item.photoUrl;
      img.alt = "Foto de Realidad Aumentada";

      const label = document.createElement("span");
      label.className = "card-label";
      label.textContent = `Foto RA #${index}`;

      card.appendChild(img);
      card.appendChild(label);

      card.addEventListener("click", () => {
        openPhotoViewer(
          item.photoUrl,
          `Foto RA #${index} ${item.date || ""}`
        );
      });

      return card;
    }

    // Crear tarjeta para video antiguo
    function createVideoCard(item, index) {
      const card = document.createElement("div");
      card.className = "wide-card";
      card.style.marginTop = "8px";

      const video = document.createElement("video");
      video.className = `media-item ${item.appliedFilter || ""}`;
      video.muted = true;
      video.playsInline = true;

      const source = document.createElement("source");
      source.src = item.videoUrl;
      source.type = "video/mp4";

      video.appendChild(source);

      const playBadge = document.createElement("div");
      playBadge.className = "play-badge";
      playBadge.innerHTML = '<i data-lucide="play" style="width: 20px; height: 20px; fill: white;"></i>';

      const label = document.createElement("span");
      label.className = "card-label";
      label.textContent = `Video Guardado #${index}`;

      card.appendChild(video);
      card.appendChild(playBadge);
      card.appendChild(label);

      card.addEventListener("click", () => {
        openVideoViewer(item.videoUrl, item.appliedFilter);
      });

      return card;
    }

    // Crear tarjeta para GIF
    function createGifCard(item) {
      const card = document.createElement("div");
      card.className = "saved-gif-card";

      const img = document.createElement("img");
      img.className = `media-item ${item.appliedFilter || ""}`;
      img.src = item.gifUrl;
      img.alt = item.mediaName || "GIF guardado";

      const playBadge = document.createElement("div");
      playBadge.className = "play-badge";
      playBadge.innerHTML = '<i data-lucide="image" style="width: 20px; height: 20px;"></i>';

      const label = document.createElement("span");
      label.className = "card-label";
      label.textContent = item.mediaName || "GIF guardado";

      card.appendChild(img);
      card.appendChild(playBadge);
      card.appendChild(label);

      card.addEventListener("click", () => {
        openGifViewer(item.gifUrl, item.appliedFilter);
      });

      return card;
    }

    // Separar los elementos guardados por tipo
    const savedPhotos = savedGallery.filter(item =>
      item.type === "photo" ||
      (!!item.photoUrl && !item.videoUrl && !item.gifUrl)
    );

    const savedGifs = savedGallery.filter(item =>
      item.type === "gif" || !!item.gifUrl
    );

    const savedVideos = savedGallery.filter(item =>
      !!item.videoUrl && item.type !== "gif"
    );

    // 1. Fotos de Realidad Aumentada
    if (savedPhotos.length > 0) {
      const photoSection = createSectionTitle(
        `Fotos de Realidad Aumentada (${savedPhotos.length})`,
        "Fotografías tomadas desde la cámara."
      );

      savedPhotos.forEach((item, index) => {
        photoSection.appendChild(
          createPhotoCard(item, index + 1)
        );
      });

      savedVideosContainer.appendChild(photoSection);
    }

    // 2. GIF organizados por equipo
    if (savedGifs.length > 0) {
      const gifSection = createSectionTitle(
        `GIF Guardados (${savedGifs.length})`,
        "Tus GIF están organizados según el equipo seleccionado."
      );

      // Agrupar GIF por equipo
      const gifsByTeam = {};

      savedGifs.forEach(item => {
        const teamId = item.teamId || "otros";
        const teamName = item.teamName || "Otros GIF";

        if (!gifsByTeam[teamId]) {
          gifsByTeam[teamId] = {
            name: teamName,
            gifs: []
          };
        }

        gifsByTeam[teamId].gifs.push(item);
      });

      // Mostrar cada equipo
      Object.keys(gifsByTeam).forEach(teamId => {
        const team = gifsByTeam[teamId];

        const teamSection = document.createElement("div");
        teamSection.className = "team-gallery-section";

        const teamTitle = document.createElement("div");
        teamTitle.className = "team-gallery-title";

        // Buscar logo del equipo
        const teamLogos = {
          yankees: "147",
          athletics: "133",
          mariners: "136",
          redsox: "111",
          astros: "117",
          rangers: "140",
          angels: "108",
          orioles: "110",
          bluejays: "141",
          guardians: "114",
          cubs: "112",
          cardinals: "138",
          giants: "137",
          padres: "135",
          braves: "144"
        };

        if (teamLogos[teamId]) {
          const logo = document.createElement("img");
          logo.src = `https://www.mlbstatic.com/team-logos/${teamLogos[teamId]}.svg`;
          logo.alt = team.name;
          teamTitle.appendChild(logo);
        }

        const teamName = document.createElement("span");
        teamName.textContent = `${team.name} (${team.gifs.length})`;
        teamTitle.appendChild(teamName);

        const gifGrid = document.createElement("div");
        gifGrid.className = "saved-gif-grid";

        team.gifs.forEach(item => {
          gifGrid.appendChild(createGifCard(item));
        });

        teamSection.appendChild(teamTitle);
        teamSection.appendChild(gifGrid);

        gifSection.appendChild(teamSection);
      });

      savedVideosContainer.appendChild(gifSection);
    }

    // 3. Videos guardados anteriormente
    if (savedVideos.length > 0) {
      const videoSection = createSectionTitle(
        `Videos Guardados (${savedVideos.length})`,
        "Videos que ya habías guardado anteriormente."
      );

      savedVideos.forEach((item, index) => {
        videoSection.appendChild(
          createVideoCard(item, index + 1)
        );
      });

      savedVideosContainer.appendChild(videoSection);
    }

    // Mensaje cuando no hay creaciones guardadas
    if (
      savedPhotos.length === 0 &&
      savedGifs.length === 0 &&
      savedVideos.length === 0
    ) {
      const emptySection = createSectionTitle(
        "Tus creaciones",
        "Aquí aparecerán tus fotos de RA y los GIF que guardes desde Filtros."
      );

      const emptyMessage = document.createElement("div");
      emptyMessage.className = "saved-empty";
      emptyMessage.textContent = "Todavía no tienes creaciones guardadas.";

      emptySection.appendChild(emptyMessage);
      savedVideosContainer.appendChild(emptySection);
    }

    lucide.createIcons();
  </script>

</body>
</html>
