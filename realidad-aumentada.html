<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strike Zone - Realidad Aumentada</title>
  
  <!-- Iconos Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <!-- Three.js y OBJLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #b5d5f5;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    .mobile-container {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 16px 95px;
      position: relative;
    }

    /* Encabezado */
    .header-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
      width: 100%;
    }

    .header-title h1 {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #000;
    }

    .ball-icon {
      font-size: 26px;
      line-height: 1;
    }

    /* Tarjeta Principal Verde */
    .ar-main-card {
      width: 100%;
      flex: 1;
      background: linear-gradient(180deg, #74a754 0%, #2f6b43 100%);
      border-radius: 28px;
      padding: 14px 14px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      position: relative;
    }

    /* Banner Superior */
    .ar-banner {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px 10px;
    }

    .ar-banner h2 {
      font-family: Georgia, serif;
      font-size: 19px;
      font-weight: bold;
      color: #111;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .ar-banner img {
      width: 38px;
      height: 38px;
      object-fit: contain;
    }

    /* Visor / Cámara */
    .viewport-box {
      width: 100%;
      height: 380px;
      background-color: #000;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }

    video#cameraStream {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .default-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .scanner-brackets {
      position: absolute;
      width: 78%;
      height: 78%;
      border: 3.5px solid rgba(255, 255, 255, 0.7);
      border-radius: 24px;
      z-index: 2;
      pointer-events: none;
      box-sizing: border-box;
    }

    #threeCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: auto;
      cursor: grab;
    }

    #threeCanvas:active {
      cursor: grabbing;
    }

    .model-tag {
      position: absolute;
      bottom: 12px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      padding: 5px 12px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      z-index: 4;
      pointer-events: none;
    }

    /* Controles Inferiores */
    .controls-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-around;
      margin-top: 20px;
      padding: 0 4px;
    }

    .control-btn {
      border: none;
      background: #ffffff;
      color: #2f6b43;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: transform 0.1s ease;
    }

    .control-btn:active {
      transform: scale(0.9);
    }

    .arrow-btn {
      width: 46px;
      height: 46px;
    }

    .camera-btn {
      width: 50px;
      height: 50px;
    }

    .confetti-btn {
      width: 52px;
      height: 52px;
      background: #ffffff;
      border: 3px solid #74a754;
    }

    .qr-btn {
      width: 48px;
      height: 48px;
      background: #ffffff;
      border-radius: 14px;
    }

    /* Botón flotante para rotar */
    .action-badge {
      background: rgba(255, 255, 255, 0.9);
      border: none;
      border-radius: 18px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: bold;
      color: #1a4d2e;
      margin-top: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    /* Botón Home Flotante Fijo */
    .home-container {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .home-btn {
      width: 56px;
      height: 56px;
      background: #3c65c4;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-decoration: none;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      border: 3px solid #ffffff;
      pointer-events: auto;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .home-btn:active {
      transform: scale(0.9);
      background-color: #2b4b9b;
    }

    /* Realidad Aumentada real (MindAR), confinada dentro del recuadro de cámara */
    .ar-scan-container {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 6;
      background: #000;
    }

    .ar-scan-container.active {
      display: block;
    }

    .ar-scan-container a-scene {
      width: 100% !important;
      height: 100% !important;
    }

    /* Fuerza que el video de la cámara y el canvas de A-Frame/MindAR
       se ajusten al recuadro en vez de irse a pantalla completa */
    .ar-scan-container canvas,
    .ar-scan-container video {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    .ar-close-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 10;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: 2px solid #fff;
      font-size: 16px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .ar-status-tag {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      padding: 5px 12px;
      border-radius: 12px;
      z-index: 10;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <main class="mobile-container">
    <!-- Encabezado -->
    <header class="header-title">
      <h1>Strike Zone</h1>
      <span class="ball-icon">⚾</span>
    </header>

    <!-- Tarjeta Verde de Realidad Aumentada -->
    <div class="ar-main-card">
      <div class="ar-banner">
        <h2>Realidad Aumentada</h2>
        <img src="https://cdn-icons-png.flaticon.com/512/33/33736.png" alt="Pelota">
      </div>

      <!-- Visor con Three.js -->
      <div class="viewport-box" id="viewport">
        <img class="default-bg" id="defaultBg" src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600&auto=format&fit=crop&q=80" alt="Fondo">
        <video id="cameraStream" autoplay playsinline style="display: none;"></video>
        <div class="scanner-brackets"></div>

        <canvas id="threeCanvas"></canvas>
        <span id="modelLabel" class="model-tag">Cargando Modelo...</span>

        <!-- Realidad Aumentada real (MindAR), confinada a este mismo recuadro -->
        <div class="ar-scan-container" id="arScanContainer">
          <button class="ar-close-btn" id="arCloseBtn" aria-label="Cerrar escáner">✕</button>
          <span class="ar-status-tag" id="arStatusTag">Apunta la cámara al target…</span>
          <div id="arSceneHolder" style="width:100%; height:100%;"></div>
        </div>
      </div>

      <!-- Botón para alternar rotación -->
      <button class="action-badge" id="danceToggle">
        <i data-lucide="play" style="width: 14px; height: 14px;"></i>
        <span id="danceText">Activar Rotación</span>
      </button>

      <!-- Fila de Controles -->
      <footer class="controls-row">
        <!-- Flecha Izquierda: Modelo Anterior -->
        <button class="control-btn arrow-btn" id="prevModelBtn" aria-label="Modelo Anterior">
          <i data-lucide="chevron-left" style="width: 28px; height: 28px;"></i>
        </button>

        <!-- Tomar Foto -->
        <button class="control-btn camera-btn" id="takePhoto" aria-label="Tomar Foto">
          <i data-lucide="camera" style="width: 26px; height: 26px;"></i>
        </button>

        <!-- Botón Blanco: Confeti -->
        <button class="control-btn confetti-btn" id="confettiBtn" aria-label="Lanzar Partículas"></button>

        <!-- Activar Cámara -->
        <button class="control-btn qr-btn" id="scanBtn" aria-label="Activar Cámara">
          <i data-lucide="video" style="width: 26px; height: 26px;"></i>
        </button>

        <!-- Flecha Derecha: Siguiente Modelo -->
        <button class="control-btn arrow-btn" id="nextModelBtn" aria-label="Siguiente Modelo">
          <i data-lucide="chevron-right" style="width: 28px; height: 28px;"></i>
        </button>
      </footer>
    </div>

    <!-- Botón Inicio Fijo -->
    <div class="home-container">
      <a href="index.html" class="home-btn" aria-label="Ir al Inicio">
        <i data-lucide="home" style="width: 26px; height: 26px;"></i>
      </a>
    </div>
  </main>

  <script>
    lucide.createIcons();

    // 1. Catálogo de Modelos OBJ
    const modelList = [
      { id: 'modelo1', name: 'Capitán Whiskers (Modelo 1)', file: 'modelo1.obj' },
      { id: 'modelo2', name: 'Trofeo Mascota (Modelo 2)', file: 'modelo2.obj' }
    ];
    let currentModelIndex = 0;

    // 2. Configuración Three.js
    const canvas = document.getElementById("threeCanvas");
    const viewport = document.getElementById("viewport");
    const modelLabel = document.getElementById("modelLabel");

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, viewport.clientWidth / viewport.clientHeight, 0.01, 100);
    camera.position.set(0, 0, 1.8);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // Iluminación
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight1.position.set(2, 4, 3);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0x74a754, 0.8);
    dirLight2.position.set(-2, -3, -2);
    scene.add(dirLight2);

    let loadedObject = null;
    let isRotating = false;
    const objLoader = new THREE.OBJLoader();

    // 3. Función para cargar y cambiar modelos dinámicamente
    function loadSelectedModel(index) {
      modelLabel.textContent = `Cargando...`;

      // Si ya había un modelo cargado, lo removemos de la escena
      if (loadedObject) {
        scene.remove(loadedObject);
        loadedObject = null;
      }

      const item = modelList[index];

      objLoader.load(
        item.file,
        (object) => {
          const material = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.35,
            metalness: 0.15,
            side: THREE.DoubleSide
          });

          object.traverse((child) => {
            if (child.isMesh) {
              child.material = material;
              child.geometry.computeVertexNormals();
            }
          });

          // Centrar modelo en el origen
          const box = new THREE.Box3().setFromObject(object);
          const center = box.getCenter(new THREE.Vector3());
          object.position.sub(center);

          const group = new THREE.Group();
          group.add(object);
          scene.add(group);
          loadedObject = group;

          modelLabel.textContent = item.name;
        },
        undefined,
        (error) => {
          console.error("Error al cargar " + item.file, error);
          modelLabel.textContent = `Error: archivo ${item.file} no encontrado`;
        }
      );
    }

    // Cargar el primer modelo al iniciar
    loadSelectedModel(currentModelIndex);

    // 4. Navegación entre modelos (Flechas ◀ y ▶)
    document.getElementById("prevModelBtn").addEventListener("click", () => {
      currentModelIndex = (currentModelIndex - 1 + modelList.length) % modelList.length;
      loadSelectedModel(currentModelIndex);
    });

    document.getElementById("nextModelBtn").addEventListener("click", () => {
      currentModelIndex = (currentModelIndex + 1) % modelList.length;
      loadSelectedModel(currentModelIndex);
    });

    // 5. Animación y Loop
    function animate() {
      requestAnimationFrame(animate);
      if (loadedObject && isRotating) {
        loadedObject.rotation.y += 0.015;
      }
      renderer.render(scene, camera);
    }
    animate();

    // 6. Rotación manual táctil y ratón
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };

    function onPointerDown(e) {
      isDragging = true;
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      previousMousePosition = { x: clientX, y: clientY };
    }

    function onPointerMove(e) {
      if (!isDragging || !loadedObject) return;
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);

      const deltaX = clientX - previousMousePosition.x;
      const deltaY = clientY - previousMousePosition.y;

      loadedObject.rotation.y += deltaX * 0.01;
      loadedObject.rotation.x += deltaY * 0.01;

      previousMousePosition = { x: clientX, y: clientY };
    }

    function onPointerUp() {
      isDragging = false;
    }

    canvas.addEventListener('mousedown', onPointerDown);
    canvas.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    canvas.addEventListener('touchstart', onPointerDown, { passive: true });
    canvas.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp);

    // 7. Botones de Acción
    document.getElementById("danceToggle").addEventListener("click", () => {
      isRotating = !isRotating;
      document.getElementById("danceText").textContent = isRotating ? "Pausar Rotación" : "Activar Rotación";
    });

    document.getElementById("confettiBtn").addEventListener("click", () => {
      confetti({ particleCount: 75, spread: 60, origin: { y: 0.6 } });
    });

    // Realidad Aumentada real (MindAR), embebida dentro del mismo recuadro
    // de cámara de esta página (sin iframe, sin pantalla completa).
    const arScanContainer = document.getElementById("arScanContainer");
    const arSceneHolder = document.getElementById("arSceneHolder");
    const arStatusTag = document.getElementById("arStatusTag");
    const arCloseBtn = document.getElementById("arCloseBtn");

    let arScriptsLoaded = false;
    let arSceneEl = null;

    // Mapa target -> modelo. Por ahora solo el target 0 tiene modelo asignado;
    // cuando tengas más targets en tu targets.mind, agrega aquí más entradas
    // (targetIndex debe coincidir con el orden en que compilaste el .mind).
    const arTargetModelMap = {
      0: "modelo1.obj"
      // 1: "modelo2.obj",
    };

    function loadScriptOnce(src) {
      return new Promise((resolve, reject) => {
        if (document.querySelector(`script[src="${src}"]`)) return resolve();
        const s = document.createElement("script");
        s.src = src;
        s.onload = () => resolve();
        s.onerror = () => reject(new Error("No se pudo cargar " + src));
        document.head.appendChild(s);
      });
    }

    async function ensureArScriptsLoaded() {
      if (arScriptsLoaded) return;
      // Nota: A-Frame reemplaza la variable global THREE por la suya al cargar.
      // Esto no afecta tu visor 3D de arriba porque ya usa sus propios
      // objetos (scene, camera, renderer, objLoader) creados de antemano.
      await loadScriptOnce("https://aframe.io/releases/1.5.0/aframe.min.js");
      await loadScriptOnce("https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.loaders.min.js");
      await loadScriptOnce("https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js");
      arScriptsLoaded = true;
    }

    function buildArTargetsHTML() {
      return Object.entries(arTargetModelMap).map(([targetIndex, objFile]) => `
        <a-entity mindar-image-target="targetIndex: ${targetIndex}">
          <a-entity
            obj-model="obj: url(${objFile})"
            scale="0.01 0.01 0.01"
            position="0 0 0"
            rotation="0 0 0"
          ></a-entity>
        </a-entity>
      `).join("");
    }

    async function startArScan() {
      arStatusTag.textContent = "Cargando escáner...";
      arScanContainer.classList.add("active");

      try {
        await ensureArScriptsLoaded();
      } catch (err) {
        arStatusTag.textContent = "No se pudo cargar el escáner AR.";
        console.error(err);
        return;
      }

      // imageTargetSrc apunta a tu archivo compilado. Ajusta la ruta si
      // colocas targets.mind en otra carpeta.
      arSceneHolder.innerHTML = `
        <a-scene
          mindar-image="imageTargetSrc: assets/targets.mind; autoStart: true; uiScanning: no; uiLoading: no; uiError: no;"
          color-space="sRGB"
          renderer="colorManagement: true, physicallyCorrectLights"
          vr-mode-ui="enabled: false"
          device-orientation-permission-ui="enabled: true"
          embedded
          style="width:100%; height:100%;"
        >
          <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
          <a-light type="ambient" color="#fff" intensity="1"></a-light>
          <a-light type="directional" color="#fff" intensity="0.9" position="1 2 1"></a-light>
          ${buildArTargetsHTML()}
        </a-scene>
      `;

      arSceneEl = arSceneHolder.querySelector("a-scene");

      arSceneHolder.querySelectorAll("[mindar-image-target]").forEach((el) => {
        el.addEventListener("targetFound", () => {
          arStatusTag.textContent = "¡Modelo encontrado!";
        });
        el.addEventListener("targetLost", () => {
          arStatusTag.textContent = "Apunta la cámara al target…";
        });
      });
    }

    function stopArScan() {
      if (arSceneEl && arSceneEl.systems && arSceneEl.systems["mindar-image"]) {
        try { arSceneEl.systems["mindar-image"].stop(); } catch (e) {}
      }
      arSceneHolder.innerHTML = "";
      arSceneEl = null;
      arScanContainer.classList.remove("active");
      arStatusTag.textContent = "Apunta la cámara al target…";
    }

    document.getElementById("scanBtn").addEventListener("click", () => {
      if (arScanContainer.classList.contains("active")) {
        stopArScan();
      } else {
        startArScan();
      }
    });

    arCloseBtn.addEventListener("click", stopArScan);

    // Captura de foto
    document.getElementById("takePhoto").addEventListener("click", () => {
      viewport.style.filter = "brightness(2)";
      setTimeout(() => {
        viewport.style.filter = "none";
        alert("¡Fotografía capturada!");
      }, 150);
    });
  </script>
</body>
</html>
